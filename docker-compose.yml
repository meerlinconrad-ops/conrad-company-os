version: '3.8'

services:
  conrad-crm:
    build: .
    container_name: conrad-crm
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=/data/crm.db
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:1.5b
    volumes:
      - crm_data:/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: conrad-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  crm_data:
  ollama_models:
